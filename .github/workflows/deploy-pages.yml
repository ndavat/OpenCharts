name: Deploy stocks terminal to Pages

# Static GitHub Pages host for the US-equities build. Yahoo/Nasdaq data routes
# are served by the Worker deployed in deploy-worker.yml (see DEPLOYMENT.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build stocks terminal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Without the Worker origin the static build would load but show no data.
      - name: Require proxy origin
        env:
          PROXY_ORIGIN: ${{ vars.PROXY_ORIGIN }}
        run: |
          if [ -z "$PROXY_ORIGIN" ]; then
            echo "::error::Set repository variable PROXY_ORIGIN to the Worker origin (see DEPLOYMENT.md)."
            exit 1
          fi

      # BASE_PATH makes asset URLs resolve under /<repo>/ on project Pages.
      # The proxy origin is baked in at build time because VITE_* is compile-time.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ADAPTER: stocks
          VITE_PROXY_ORIGIN: ${{ vars.PROXY_ORIGIN }}
          # The production CSP is `connect-src 'self'`; allow the Worker too.
          VITE_CSP_EXTRA_CONNECT: ${{ vars.PROXY_ORIGIN }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
